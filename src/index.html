<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headline Anchor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root, :root[data-theme="dark"] {
        --bg:#0b0c0e; --surface:#121316; --surface2:#17181b; --raised:#1c1e22;
        --border:#26282c; --border2:#34373c;
        --text:#f2f0ec; --text2:#9a978f; --muted:#66635c;
        --accent:#6fb3ff; --accentText:#a7d0f5; --accentBg:rgba(91,155,213,.14); --accentBorder:#2f4a66;
        --edit:#e5484d; --editText:#ef938f; --editBg:rgba(229,72,77,.13);
        --ok:#3fae6f; --okText:#7fd3a3; --okBg:rgba(63,174,111,.13); --okBorder:rgba(63,174,111,.4);
        --warn:#d99a3c; --sealStroke:#5b9bd5; --inputBg:#0e0f11; --redact:#1e2024;
        --grid:rgba(230,225,215,.045); --shadow:0 30px 70px -30px rgba(0,0,0,.8);
      }
      :root[data-theme="light"] {
        --bg:#f3f0e9; --surface:#fbf9f4; --surface2:#efece3; --raised:#f5f2ea;
        --border:#ddd8cc; --border2:#cbc4b4;
        --text:#1a1815; --text2:#57534b; --muted:#8a857a;
        --accent:#1f6fd4; --accentText:#1a5fb8; --accentBg:rgba(31,111,212,.09); --accentBorder:#bcd4f2;
        --edit:#c22f2f; --editText:#a3271f; --editBg:rgba(194,47,47,.08);
        --ok:#1f8a52; --okText:#167042; --okBg:rgba(31,138,82,.1); --okBorder:rgba(31,138,82,.35);
        --warn:#b07a1e; --sealStroke:#1f6fd4; --inputBg:#fbf9f4; --redact:#e6e1d6;
        --grid:rgba(40,35,25,.05); --shadow:0 30px 70px -32px rgba(60,50,35,.35);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Archivo', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 30px 30px, 30px 30px;
        background-attachment: fixed;
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color .3s, color .3s;
      }
      #root { min-height: 100vh; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { opacity: .82; }
      .wire-item:hover { opacity: 1; }
      .wire-item:hover .wire-quote { text-decoration: underline; text-underline-offset: 2px; }
      input { font-family: inherit; }
      code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
      ::selection { background: rgba(111,179,255,.24); }

      @keyframes ha-reveal { 0%,16%{transform:scaleX(1)} 44%,86%{transform:scaleX(0)} 100%{transform:scaleX(1)} }
      @keyframes ha-spin { to { transform: rotate(360deg); } }
      @keyframes ha-pulse { 0%{transform:scale(.7);opacity:.6} 100%{transform:scale(2.2);opacity:0} }
      @keyframes ha-live { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.6)} }
      @keyframes ha-stamp { 0%{opacity:0;transform:scale(1.7) rotate(-3deg)} 9%{opacity:1;transform:scale(.9) rotate(-3deg)} 14%{transform:scale(1.05) rotate(-3deg)} 20%,100%{opacity:1;transform:scale(1) rotate(-3deg)} }
      @keyframes ha-marq { from{transform:translateX(0)} to{transform:translateX(-50%)} }
      @keyframes ha-fade { from{opacity:0} to{opacity:1} }
      @keyframes ha-pop { from{opacity:0;transform:translateY(16px) scale(.98)} to{opacity:1;transform:none} }
      @keyframes ha-enter { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
